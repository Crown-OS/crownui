[package]
name = "impeller"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Impeller (Flutter's renderer) backend for CrownUI: text shaping and Vulkan/GLES rendering on Wayland."

[dependencies]
graphics = { path = "../graphics" }
geometry = { path = "../geometry" }
impellers = { version = "=0.4.3", features = ["prebuilt_libs", "cache_libs"] }
ash = "0.38"
khronos-egl = { version = "6", features = ["static"] }
glow = "0.16"
png = "0.18"
wayland-egl = "0.32"
raw-window-handle = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[features]
static = ["impellers/static_link"]

[dev-dependencies]
gbm = { version = "0.18", default-features = false }
anyhow = { workspace = true }
input = { path = "../input" }
windowing = { path = "../windowing" }

[lints]
workspace = true
