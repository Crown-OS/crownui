[package]
name = "crowndev"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Developer CLI for running CrownUI apps: list them, print and watch their semantic trees, inspect them and act on nodes over MCP."

[dependencies]
anyhow = { workspace = true }
mcp = { path = "../mcp" }
rmcp = { version = "3.5", default-features = false, features = ["client"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util"] }

[dev-dependencies]
geometry = { path = "../geometry" }
semantics = { path = "../semantics" }
tempfile = "3"

[lints]
workspace = true
