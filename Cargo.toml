[workspace]
resolver = "3"
members = [
  "geometry",
  "crownconfig",
  "input",
  "reactive",
  "motion",
  "windowing",
  "graphics",
  "layouting",
  "semantics",
  "gesture",
  "inspect",
  "impeller",
  "taffy-layout",
  "accessibility",
  "mcp",
  "view",
  "runtime",
  "widgets",
  "crownui",
  "crowntest",
  "crownmcp",
  "crowndev",
  "xtask",
]

[profile.release]
debug = true

[workspace.package]
edition = "2024"
rust-version = "1.97"

[workspace.dependencies]
anyhow = "1"
crossbeam-channel = "0.5"
insta = "1"
proptest = "1"
raw-window-handle = "0.6"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slotmap = "1"
smallvec = { version = "1", features = ["union", "const_generics"] }
taffy = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1"
