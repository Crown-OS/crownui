[package]
name = "semantics"
version = "0.1.0"
edition = "2024"
description = "The semantic tree of a CrownUI app, shared by accessibility, MCP, devtools and crowntest."

[dependencies]
geometry = { path = "../geometry" }
input = { path = "../input" }
serde = { workspace = true, optional = true }
thiserror = { workspace = true }

[features]
serde = ["dep:serde", "geometry/serde", "input/serde"]
