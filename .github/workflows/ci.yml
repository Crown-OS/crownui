name: CI

# Based on Crown-OS/.github rust.yml. It is not called directly because CrownUI
# depends on crownos-config and crownos-protocols by path, which needs the flat
# sibling checkout that rust.yml no longer provides.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  CROWN_CONFIG_DIR: /tmp/crownos-ci
  # rust-cache does not keep the workspace crates, so cargo rebuilds them on
  # each run. sccache uses the file contents as the key and returns the crates
  # that did not change. The action reports the hits after the job.
  # If sccache cannot reach its own server, rustc runs directly.
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: 'true'
  SCCACHE_IGNORE_SERVER_IO_ERROR: 1
  # Backtraces keep the file and line. Links are faster and target/ is smaller.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

defaults:
  run:
    working-directory: crownui

jobs:
  check:
    name: fmt / clippy / test / bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: crownui

      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.19.0

      - uses: ./crownui/.github/actions/setup

      - name: rustfmt
        run: cargo fmt --check

      - name: Crate layering
        run: cargo xtask layers

      - name: Clippy
        run: env -u RUSTC_WRAPPER cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # Assembles the single publishable crate and verifies it with `cargo package`,
      # so anything that would break a release fails here first.
      - name: Bundle
        run: cargo xtask bundle
