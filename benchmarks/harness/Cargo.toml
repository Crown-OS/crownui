[package]
name = "crownbench"
version = "0.1.0"
edition = "2024"
publish = false
description = "Builds the same three scenarios in CrownUI, GPUI, Qt, Electron and Tauri and measures them from the outside."

[dependencies]
anyhow = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
