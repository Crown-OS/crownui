[package]
name = "runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Runs CrownUI apps: generic over platform, graphics backend and layout engine; owns the render thread."

[dependencies]
accessibility = { path = "../accessibility", optional = true }
crossbeam-channel = { workspace = true }
geometry = { path = "../geometry" }
graphics = { path = "../graphics" }
input = { path = "../input" }
inspect = { path = "../inspect" }
layouting = { path = "../layouting" }
mcp = { path = "../mcp", optional = true }
serde_json = { workspace = true, optional = true }
motion = { path = "../motion" }
semantics = { path = "../semantics" }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true }
view = { path = "../view" }
windowing = { path = "../windowing", default-features = false }

[features]
default = ["tokio"]
tokio = ["dep:tokio"]
mcp = ["dep:mcp", "dep:serde_json", "tokio"]
accessibility = ["dep:accessibility"]

[dev-dependencies]
anyhow = { workspace = true }
libc = "0.2"
reactive = { path = "../reactive" }
semantics = { path = "../semantics" }
serde = { workspace = true }
serde_json = { workspace = true }
taffy-layout = { path = "../taffy-layout" }
widgets = { path = "../widgets" }
windowing = { path = "../windowing", default-features = false, features = ["headless"] }

[[bench]]
name = "frame"
harness = false

[lints]
workspace = true
