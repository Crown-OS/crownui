[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false
description = "Workspace automation: check, layers, api, snapshot, preview. Every command supports --json."

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { version = "0.9", features = ["preserve_order"] }
crowntest = { path = "../crowntest" }
geometry = { path = "../geometry" }
impeller = { path = "../impeller" }
runtime = { path = "../runtime", default-features = false }
taffy-layout = { path = "../taffy-layout" }
widgets = { path = "../widgets" }

