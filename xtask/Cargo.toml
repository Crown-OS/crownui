[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Workspace automation: check, layers, api, snapshot, shaders, preview. Every command supports --json."

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { version = "0.9", features = ["preserve_order"] }
crowntest = { path = "../crowntest" }
geometry = { path = "../geometry" }
impeller = { path = "../impeller" }
runtime = { path = "../runtime", default-features = false }
taffy-layout = { path = "../taffy-layout" }
widgets = { path = "../widgets" }


[lints]
workspace = true
